  - id: icons
    title: "Іконки застосунку"
    page: /vector/icons.html
    short: "Будиночок, лупа, конверт, дзвоник, кошик, камера, календар і шестерня."
    intro: "Для іконок важливо, щоб усі вони виглядали як одна родина. Допоможе сітка з прив'язкою, однакова товщина ліній, однакові закруглення й одна палітра кольорів."
    tips:
      - "Увімкни сітку й прив'язку, щоб фігури лягали рівно."
      - "Тримай однакову товщину ліній у всіх іконках."
      - "Роби однакові закруглення кутів."
      - "Використовуй одну палітру з 2–3 кольорів."
    cards:
      - id: home
        title: "Будиночок"
        alt: "Будиночок: жовті стіни, червоний трикутний дах, сірий димар, синє двері й два квадратні віконця"
        shapes: "квадрат, трикутник-дах, прямокутник-двері"
        skills: [shapes, align-grid]
        level: 1
        anim: "З димаря йде дим."
      - id: search
        title: "Лупа"
        alt: "Лупа: блакитне коло зі скла з білим відблиском і помаранчева ручка, нахилена вниз праворуч"
        shapes: "кільце й нахилена ручка"
        skills: [shapes, path-ops, align-grid]
        level: 1
        anim: "Лупа ковзає й шукає."
      - id: mail
        title: "Конверт"
        alt: "Жовтий конверт із білим трикутним клапаном і двома лініями складок унизу"
        shapes: "прямокутник і трикутник-клапан"
        skills: [shapes, nodes, align-grid]
        level: 1
        anim: "Клапан відкривається."
      - id: bell
        title: "Дзвоник"
        alt: "Жовтий дзвоник із маленьким колом угорі, білим відблиском, помаранчевою смужкою-краєм і язичком унизу"
        shapes: "дзвін із вигнутим контуром (вузли), заокруглений прямокутник-край, мале коло угорі, півколо-язичок унизу, біла дуга-відблиск"
        skills: [shapes, path-ops, nodes]
        level: 2
        anim: "Дзвоник гойдається."
      - id: cart
        title: "Кошик"
        alt: "Кошик для покупок: синій кошик у формі трапеції з двома білими прорізами, чорна ручка-рамка зліва, що переходить у нижню планку, та два чорні колеса"
        shapes: "трапеція із закругленим кутом, товста лінія з заокругленими кінцями як ручка й планка, два білі відрізки-прорізи, два кола-колеса"
        skills: [shapes, duplicate-group, align-grid]
        level: 2
        anim: "Кошик їде, колеса крутяться."
      - id: camera
        title: "Камера"
        alt: "Фотокамера: сірий закруглений корпус, великий синій об'єктив з відблиском і жовтий спалах у верхньому куті"
        shapes: "закруглений прямокутник, коло-об'єктив, малий прямокутник-спалах"
        skills: [shapes, align-grid, duplicate-group]
        level: 2
        anim: "Спалах миготить."
      - id: calendar
        title: "Календар"
        alt: "Календар: біла сторінка з червоною смужкою зверху, двома кільцями та шістьма квадратиками-днями, один із них жовтий"
        shapes: "закруглений прямокутник, верхня смужка, два кільця, сітка квадратів"
        skills: [shapes, align-grid, duplicate-group]
        level: 2
        anim: "Аркуш гортається."
      - id: gear
        title: "Шестерня"
        alt: "Сіра шестерня з вісьмома зубцями й круглим отвором посередині"
        shapes: "коло із зубцями, отвір у центрі (Різниця)"
        skills: [shapes, path-ops, duplicate-group]
        level: 3
        anim: "Шестерня обертається."
