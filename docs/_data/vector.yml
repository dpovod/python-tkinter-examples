        skills: [shapes, nodes, duplicate-group]
        level: 2
        anim: "Вуха сіпаються, кіт моргає."
      - id: monster
        title: "Монстрик"
        alt: "Фіолетовий круглий монстрик із двома жовтими ріжками, одним великим оком і ротом із чотирма білими зубами"
        shapes: "багатокутник або зірка для тіла, одне велике око, ряд зубів"
        skills: [shapes, nodes, path-ops]
        level: 2
        anim: "Монстрик відкриває й закриває пащу."
      - id: owl
        title: "Сова"
        alt: "Сова з овальним тулубом, вухами-китичками, двома великими білими очима, помаранчевим дзьобом, крилами по боках і пір'ям-дугами на животі"
        shapes: "овал-тулуб, два великі кола-очі з зіницями, трикутник-дзьоб, дуги-пір'я"
        skills: [shapes, duplicate-group, align-grid]
