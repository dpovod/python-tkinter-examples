# Розділ «Векторна графіка» (Inkscape): прийоми пам'ятки й картки наборів.
# Одне джерело для сторінок наборів (_layouts/vector-track.html), хаба
# (список і кнопка «Випадкова картка») та посилань «прийом → пам'ятка».
#
# Картка: id (якір на сторінці набору), title, shapes (з яких фігур),
# skills (id прийомів із skills), level (1–3 → ★), alt (опис зразка; без нього
# зразок не показується), anim (ідея для анімації; на картці не виводиться),
# sample (необов'язково: офіційний зразок; TODO — не показується).
#
# Рівні складності: 1 — ★, 2 — ★★, 3 — ★★★.

skills:
  interface:
    title: "Інтерфейс"
    anchor: interface
  shapes:
    title: "Фігури, заливка й контур"
    anchor: shapes
  select:
    title: "Виділення кількох об'єктів"
    anchor: select
  path-ops:
    title: "Контур: Об'єднання, Різниця, Перетин"
    anchor: path-ops
  nodes:
    title: "Редагування вузлів"
    anchor: nodes
  align-grid:
    title: "Вирівнювання, сітка й прив'язка"
    anchor: align-grid
  duplicate-group:
    title: "Дублювання й групування"
    anchor: duplicate-group
  z-order:
    title: "Порядок накладання"
    anchor: z-order
  save:
    title: "Збереження"
    anchor: save

tracks:
  - id: map-marks
    title: "Мітки для карти"
    page: /vector/marks.html
    short: "Мітка місця призначення та круглі значки для школи, кафе, парку, стадіону й інших місць."
    intro: "Мітка — це значок, який показує місце на карті. Почніть із прикладу з пам'ятки — мітки місця призначення: крапля з колом усередині показує, куди потрібно потрапити. Круглі значки позначають інші місця, а символ усередині пояснює, що це за місце."
    example_anchor: example-marker
    cards:
      - id: drop
        title: "Місце призначення"
        alt: "Червона мітка місця призначення у формі краплі з гострим низом і чорним колом усередині"
        shapes: "коло, трикутник, мале коло"
        skills: [shapes, select, path-ops, nodes]
        level: 1
        anim: "Крапля підстрибує й повертається на місце."
      - id: school
        title: "Школа"
        alt: "Синій круглий значок з білим колом усередині, у якому будиночок школи з червоним дахом і синіми дверима"
        shapes: "два кола (кільце), прямокутник, трикутник-дах, прямокутник-двері"
        skills: [shapes, align-grid]
        level: 1
        anim: "Прапорець майорить."
      - id: park
        title: "Парк"
        alt: "Зелений круглий значок з білим колом усередині, у якому дерево зі світло-зеленою кроною й коричневим стовбуром"
        shapes: "два кола (кільце), мале коло-крона, прямокутник-стовбур"
        skills: [shapes, duplicate-group]
        level: 1
        anim: "Крона дерева злегка гойдається."
      - id: cafe
        title: "Кафе"
        alt: "Помаранчевий круглий значок з білим колом усередині, у якому чашка з ручкою й двома лініями пари"
        shapes: "два кола (кільце), напівовал-чашка, дуга-ручка, дві хвилясті лінії пари"
        skills: [shapes, path-ops, duplicate-group]
        level: 2
        anim: "Над чашкою піднімається пара."
      - id: stadium
        title: "Стадіон"
        alt: "Фіолетовий круглий значок з білим колом усередині, у якому зелене футбольне поле з центральною лінією й колом"
        shapes: "два кола (кільце), овал-поле, лінія та мале коло в центрі"
        skills: [shapes, align-grid, duplicate-group]
        level: 2
        anim: "М'яч котиться полем."
      - id: hospital
        title: "Лікарня"
        alt: "Червоний круглий значок з білим колом усередині, у якому червоний хрест"
        shapes: "два кола (кільце), два прямокутники, що утворюють хрест (Об'єднання)"
        skills: [shapes, align-grid, path-ops]
        level: 2
        anim: "Хрест пульсує, як сигнал."
      - id: library
        title: "Бібліотека"
        alt: "Блакитний круглий значок з білим колом усередині, у якому відкрита жовта книга"
        shapes: "два кола (кільце), відкрита книга з двох чотирикутників зі зігнутим низом"
        skills: [shapes, nodes, duplicate-group]
        level: 2
        anim: "Сторінки перегортаються."
      - id: shop
        title: "Магазин"
        alt: "Рожевий круглий значок з білим колом усередині, у якому магазинчик із червоним смугастим тентом і синіми дверима"
        shapes: "два кола (кільце), прямокутник, трапеція-тент зі смужками, прямокутник-двері"
        skills: [shapes, align-grid, path-ops]
        level: 2
        anim: "Тент гойдається від вітру."
      - id: minimap
        title: "Карта мікрорайону з мітками"
        alt: "Схема мікрорайону: зелений парк, три жовтуваті квартали, сірий проспект навскіс, дві вулиці, синя річка внизу, шість круглих значків (парк, школа, кафе, магазин, лікарня, бібліотека) і червона мітка місця призначення на перехресті"
        shapes: "прямокутники й нерівні чотирикутники для кварталів, вигнуті лінії для доріг і річки, круглі значки з символами та мітка-крапля"
        skills: [align-grid, duplicate-group, nodes]
        level: 3
        anim: "Мітки по черзі підстрибують, а маршрут прокладається між ними."

  - id: emoji
    title: "Емодзі та персонажі"
