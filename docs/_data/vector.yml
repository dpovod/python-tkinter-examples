        anim: "Сльоза стікає по щоці."
      - id: surprised
        title: "Здивований смайлик"
        alt: "Жовте обличчя з високо піднятими дугами-бровами, великими білими очима із зіницями та відкритим овальним ротом"
        shapes: "коло, великі очі, овал-рот, дві дуги-брови"
        skills: [shapes, align-grid]
        level: 1
        anim: "Очі розширюються, рот відкривається."
      - id: wink
        title: "Смайлик, що підморгує"
        alt: "Жовте обличчя: ліве око заплющене дугою, праве відкрите, широкий відкритий рот із рожевим язиком"
        shapes: "коло, одне коло-око, дуга замість другого ока, дуга-посмішка"
        skills: [shapes, nodes]
        level: 2
        anim: "Підморгування повторюється з паузою."
      - id: cat
        title: "Кіт"
        alt: "Помаранчева голова кота з двома гострими вухами, зеленими очима з вузькими зіницями, рожевим носом, смужками на лобі й вусами"
