<!DOCTYPE html>
<html lang="{{ site.lang | default: 'uk' }}" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.className = document.documentElement.className.replace("no-js", "js");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@700;800&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <a class="skip-link" href="#content">Перейти до вмісту</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="{{ '/' | relative_url }}">
        <span class="site-logo__tile">{% include icon.html name="logo" %}</span>
        <span>{{ site.title }}</span>
      </a>
    </div>
  </header>
  <main id="content" class="container">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="container">
      <a href="{{ '/' | relative_url }}">{% include icon.html name="home" dim=16 %} На головну</a>
    </div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
