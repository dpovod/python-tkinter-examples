<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <!-- Кошик у стилі суцільних піктограм: рамка-ручка з однієї лінії, залитий кошик із двома прорізами,
       нижня планка й два колеса. Координати в системі ~270x235, далі масштабовано в центр полотна. -->
  <rect width="480" height="360" fill="#FFFFFF"/>
  <g id="art" stroke="#23222B" stroke-linecap="round" stroke-linejoin="round" transform="translate(240 182) scale(1.1) translate(-210 -222)">
    <path id="frame" fill="none" stroke-width="14" d="M82 115 H108 Q118 115 122 128 L168 292 H315"/>
    <path id="basket" fill="#3B82F6" stroke-width="5" d="M134 162 H328 Q346 162 341 180 L305 248 Q301 255 292 255 H158 Z"/>
    <g id="slits" fill="none" stroke="#FFFFFF" stroke-width="13">
      <line x1="207" y1="188" x2="207" y2="230"/>
      <line x1="252" y1="188" x2="252" y2="230"/>
    </g>
    <g id="wheels" fill="#23222B" stroke="none">
      <circle cx="188" cy="316" r="16"/>
      <circle cx="278" cy="316" r="16"/>
    </g>
  </g>
</svg>
